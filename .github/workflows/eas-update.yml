name: Automatic EAS Update
on:
  push:
    branches:
      - main

jobs:
  update:
    name: Install and publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish update to Preview
        run: eas update --branch preview --message "Automated update from GitHub Actions"
